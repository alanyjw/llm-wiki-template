name: wiki-lint

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.obsidian-linter.jsonc'
      - '.claude/scripts/wiki-lint.py'
      - '.claude/scripts/test_wiki_lint.py'
      - '.claude/scripts/wiki-lint.config.json'
      - '.claude/scripts/check-date-updated.py'
      - '.claude/scripts/test_check_date_updated.py'
      - '.claude/scripts/regenerate-index.py'
      - '.github/workflows/wiki-lint.yml'
  pull_request:
    paths:
      - 'wiki/**'
      - '.obsidian-linter.jsonc'
      - '.claude/scripts/wiki-lint.py'
      - '.claude/scripts/test_wiki_lint.py'
      - '.claude/scripts/wiki-lint.config.json'
      - '.claude/scripts/check-date-updated.py'
      - '.claude/scripts/test_check_date_updated.py'
      - '.claude/scripts/regenerate-index.py'
      - '.github/workflows/wiki-lint.yml'
  workflow_dispatch: {}

# Least privilege: this workflow only reads the repo. No writes, no packages,
# no id-token. Declared at the top level so every job inherits it.
permissions:
  contents: read

jobs:
  lint:
    name: Lint wiki/
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA, not a tag — tags
      # are mutable and a compromised upstream can repoint v5 at new code.
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0  # full history needed for the FM007 date_updated diff

      # Layer 1: vendor CLI (markdownlint-obsidian) — pinned.
      # Catches OFM frontmatter / tag / callout / embed rules + standard
      # markdownlint. Gates the build.
      # Every file under wiki/ is linted — there are NO per-file carve-outs.
      # .obsidian-linter.jsonc only ignores whole non-wiki trees (raw/, assets/,
      # templates/, prompts/) and disables individual *rules* repo-wide; it never
      # exempts a specific page. Per-rule rationale lives in that file's header.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.10'

      # NOTE: no `--bun` flag. The transitive dep markdown-flavor-detection@^0.7.3
      # declares a `"bun": "./src/node.ts"` export condition but ships only dist/
      # (no src/), so `bunx --bun` resolves the `bun` condition to an unpublished
      # file and dies with "Cannot find module 'markdown-flavor-detection/node'".
      # Without --bun, bunx uses the `import` condition -> dist/node.js
      # (published) and lints identically. Do not re-add --bun until the vendor
      # ships src/ in the published tarball.
      # THE CLI ALWAYS EXITS 0, even while printing violations — verified on
      # v1.1.0 under both bunx and npx, and there is no --strict/--fail-on flag
      # to change that. So `run: bunx ...` under `bash -e` gated NOTHING: this
      # step was named "gates the build" and had never once failed a build.
      # The gate has to live here. Parse the json formatter and fail on any
      # entry, rather than testing stdout for emptiness — that way an incidental
      # line on stdout cannot fail a clean run, and a formatter change that
      # breaks parsing is a loud error instead of a silent pass.
      - name: Layer 1 — markdownlint-obsidian (gates the build)
        id: layer1
        run: |
          set -euo pipefail
          bunx markdownlint-obsidian-cli@1.1.0 "wiki/**/*.md" \
            --vault-root wiki --output-formatter json > layer1.json
          python3 - <<'PY'
          import collections, json, sys
          try:
              data = json.load(open("layer1.json"))
          except (OSError, json.JSONDecodeError) as e:
              sys.exit(f"::error title=Layer 1::could not parse linter output: {e}")
          if not isinstance(data, list):
              sys.exit(f"::error title=Layer 1::unexpected output shape: {type(data).__name__}")
          rows = [(f.get("filePath", "?"), e) for f in data for e in f.get("errors", [])]
          if not rows:
              print(f"Layer 1 clean — {len(data)} file(s) linted.")
              sys.exit(0)
          for path, e in rows:
              print(f"::error file={path},line={e.get('line', 1)},"
                    f"col={e.get('column', 1)}::{e.get('ruleCode', '?')} "
                    f"{e.get('message', '')}")
          tally = collections.Counter(e.get("ruleCode", "?") for _, e in rows)
          print(f"\nLayer 1 FAILED — {len(rows)} violation(s) across "
                f"{len({p for p, _ in rows})} file(s):")
          for code, n in tally.most_common():
              print(f"  {code}: {n}")
          sys.exit(1)
          PY

      # Layer 2: vault-specific Python script — GATES the build.
      # The script exits 1 if and only if at least one ERROR-severity finding
      # fires; WARNING-severity findings are printed (and annotated) but exit 0.
      # Severity is assigned per finding in .claude/scripts/wiki-lint.py via the
      # SEVERITY_ERROR / SEVERITY_WARNING constants — grep `severity=` there to
      # confirm this list rather than trusting the comment.
      #
      # ERRORS — these fail CI:
      #   - WIKI001 — table-pipe-in-wikilink (breaks the Obsidian table cell)
      #   - WIKI002 — broken wikilink (Obsidian-fuzzy resolution)
      #   - WIKI003 — broken wikilink #anchor (no such heading / glossary term)
      #   - FM001  — synthesis page has no frontmatter block at all
      #   - FM004  — a *registered* page type is missing a required key
      #   - FM005  — a raw_sources path does not resolve on disk
      #   - RU001  — Recent-updates callout missing on an
      #              insight/topic/plan/project page
      #   - IO001  — a file under wiki/ could not be read/decoded
      #
      # WARNINGS — reported, but the script still exits 0:
      #   - FM002  — frontmatter present but no `type:` key. NOTE: this is only a
      #              warning, and it also *short-circuits* the per-type schema
      #              check — a page with no `type:` is never FM004-gated, so an
      #              untyped page can carry zero required keys and still pass CI.
      #   - FM003  — unknown `type:` (no schema registered); same short-circuit
      #   - FM006  — recommended frontmatter keys (date_ingested, source_count, ...)
      #   - RU002  — Recent-updates callout present but holds no dated entry
      #   - RU003  — newest callout entry is older than frontmatter date_updated
      #   - RU004  — callout holds more than 3 entries (older ones roll off)
      #   - PROV001 — direct [[raw/...]] link in a synthesis page (one-hop
      #               provenance rule; projects/ exempt for Related-sources)
      #   - WIKI007 — anchor-prose source-count mismatch on topic pages
      #
      # Warnings are not free passes — FM002/FM003 in particular mean a page is
      # silently exempt from schema enforcement. Treat a clean run as zero of
      # both severities; the gate is just the floor.
      # Stdlib only — no setup-python deps needed.
      #
      # Deliberately NOT wired in here: the advisory reports
      # (`--report orphans`, `--report symmetry`, `--report duplicates`, ...).
      # Two reasons, and the second is the one people forget:
      #   1. They are judgement calls, not contract violations — some asymmetry
      #      and some orphans are intentional, so gating on them trains people
      #      to add noise-suppressing links rather than real ones.
      #   2. They are slow. `symmetry` and `duplicates` are O(N^2) walks over
      #      the page set — measured at roughly 30s on a mid-size vault, paid on
      #      every push, for output nobody reads per-commit. Run them on demand
      #      during a lint pass instead.
      # Runs BEFORE the gates themselves, because a linter whose own rules are
      # broken cannot give a trustworthy verdict on the vault — a green Layer 2
      # from a broken gate is worse than a red one.
      #
      # Both suites cover rules that CANNOT be checked from a working tree:
      #   wiki-lint      — WIKI002's attachment exemption behaves differently on
      #                    a developer's disk (attachments present) than in CI
      #                    (gitignored, absent).
      #   check-date-updated — FM007 diffs against a base SHA, so it only ever
      #                    runs in CI. Its behaviour is invisible where the page
      #                    was written, which is how it came to red-line the
      #                    honest case of editing one page twice in a day.
      #
      # `unittest` exits 0 on "Ran 0 tests", so the count is asserted too: a
      # suite that collected nothing would otherwise pass while checking nothing.
      - name: Layer 2a — toolchain self-tests (gates the build)
        run: |
          set -o pipefail
          TOTAL=0
          for suite in test_wiki_lint test_check_date_updated; do
            echo "--- $suite ---"
            python3 ".claude/scripts/$suite.py" -v 2>&1 | tee "/tmp/$suite.log"
            COUNT=$(grep -oE '^Ran [0-9]+ test' "/tmp/$suite.log" | grep -oE '[0-9]+' | tail -1 || true)
            if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then
              echo "::error title=toolchain self-tests::$suite reported no tests. A gate whose tests did not run is a gate nobody has checked."
              exit 1
            fi
            TOTAL=$((TOTAL + COUNT))
          done
          echo "::notice title=toolchain self-tests::$TOTAL tests passed across 2 suites."

      - name: Layer 2 — wiki-lint.py (gates the build)
        id: layer2
        run: |
          python3 .claude/scripts/wiki-lint.py wiki/ --gh-annotations --vault-root .

      # FM007 — date_updated freshness (CI-only, git-aware). Fails if a synthesis
      # page's body changed in this commit/PR but date_updated was not bumped.
      # Scope: wiki/insights/, wiki/topics/, wiki/plans/, wiki/projects/.
      # Skipped on workflow_dispatch (no base SHA) and initial branch pushes.
      # Context values are passed through `env:` rather than interpolated into
      # the run block, so untrusted values can never be evaluated as shell.
      - name: Layer 2b — date_updated freshness (FM007, CI-only)
        id: date_updated_check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              BASE="$PR_BASE_SHA"
              ;;
            push)
              BASE="$PUSH_BEFORE_SHA"
              if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
                echo "Initial push — no prior commit to compare; skipping FM007."
                exit 0
              fi
              ;;
            *)
              echo "Event '$EVENT_NAME' has no base SHA — skipping FM007."
              exit 0
              ;;
          esac
          python3 .claude/scripts/check-date-updated.py --base "$BASE" --gh-annotations

      # Index drift check — fails if wiki/index.md is out of sync with the
      # filesystem (missing pages, stale per-section counts, orphan entries).
      # Fix locally with: python3 .claude/scripts/regenerate-index.py
      - name: Index drift — regenerate-index.py --check (gates the build)
        id: index_check
        run: |
          python3 .claude/scripts/regenerate-index.py --check

      - name: Done
        if: success()
        run: echo "::notice title=wiki-lint::All checks passed."
